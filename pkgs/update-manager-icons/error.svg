<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#f38ba8" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!--
    The one state that pays for a second element: the arrow shrinks to make room
    for an exclamation. Worth it here and nowhere else: error is rare, it has
    to grab attention, and it is the only state whose silhouette then differs
    from all five others rather than just its hue. The bang's dot sits at the
    baseline's height on purpose.
  -->
  <path d="M7.5 4v7.5"/>
  <path d="m3.75 8.25 3.75 3.75 3.75-3.75"/>
  <path d="M1.5 15.5h12"/>
  <path d="M19.5 6v6.5"/>
  <circle cx="19.5" cy="15.6" r="1.3" fill="currentColor" stroke="none"/>
</svg>
