<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#cdd6f4" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!--
    The arrow landing on a baseline is the identity mark and appears in every
    state: whatever the daemon is doing, the tray has to say "updates" first.
    State rides on the arrow's weight, the baseline's treatment and the colour.

    Idle is the resting shape. up-to-date.svg is deliberately identical to it,
    separated only by hue: both mean "nothing to do", and idle only exists
    until the first check runs.
  -->
  <path d="M12 3v10"/>
  <path d="m7 10 5 5 5-5"/>
  <path d="M4 18.5h16"/>
</svg>
