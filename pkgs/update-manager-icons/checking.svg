<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#89b4fa" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!--
    Busy: the baseline becomes a segmented bar. Dashes rather than dots on
    purpose. Dots keep roughly a quarter of the baseline's ink and the glyph
    reads as unfinished; 4-on-2-off keeps most of it, so the weight matches the
    settled states and the difference reads as motion. Two long dashes with a
    gap in the middle would instead read as "broken", which is error's job.
    applying.svg reuses this pattern.
  -->
  <path d="M12 3v10"/>
  <path d="m7 10 5 5 5-5"/>
  <path d="M4 18.5h16" stroke-dasharray="4 2" stroke-linecap="butt"/>
</svg>
