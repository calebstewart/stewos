[package]
name = "stewctl"
version = "0.1.0"
edition = "2021"
description = "Build and switch any StewOS host's system or home configuration"
license = "MIT"

[[bin]]
name = "stewctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
