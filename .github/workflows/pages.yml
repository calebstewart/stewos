# Build the documentation site and publish it to GitHub Pages.
#
# One job, on Linux. Reading an option tree never builds anything, so the
# nix-darwin option set evaluates here just as well as it would on a Mac -- which
# is what keeps this from needing a macOS runner and a merge step.
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments are not something to run two of at once, but neither is a
# push worth cancelling a deployment over.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the site
        run: nix build .#docs --print-build-logs

      # actions/upload-pages-artifact will not follow the store symlink, and the
      # store is read-only, so the tree is copied out and made writable first.
      - name: Stage the site
        run: |
          cp -rL result site
          chmod -R u+w site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
